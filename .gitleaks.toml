[extend]
useDefault = true

[[allowlists]]
description = "Golden test vectors are synthetic by construction; their hash-shaped values are wire-format fixtures, never credentials"
paths = [
  '''test/vectors/.*\.json$''',
]

[[allowlists]]
description = "Canonical gateway provider-wire fixtures are synthetic by construction (test-only keys derived from public labels, hash-shaped wire values) and pinned byte for byte by the gateway manifest checksums the parity test verifies"
paths = [
  '''test/fixtures/provider-wire/.*\.json$''',
]

[[allowlists]]
description = "Public development keys and deterministic security-test sentinels"
regexTarget = "secret"
regexes = [
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''0x036CbD53842c5426634e7929541eC2318f3dCF7e''',
  '''replace-with-0x-plus-64-hex-characters''',
  '''ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789''',
  '''reply-to-inbound-1''',
  '''bearer-secret-value''',
  '''dXNlcjpwYXNzd29yZA''',
  '''S3cretPassw0rd''',
  '''real-api-key''',
  '''live-key''',
]
